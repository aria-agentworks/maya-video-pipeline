name: Generate Maya Test Images

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        env:
          REPLICATE_API_TOKEN: "${{ secrets.REPLICATE_API_KEY }}"
        run: |
          pip install -r requirements.txt
          pip install replicate requests boto3 botocore
      - name: Generate images
        env:
          REPLICATE_API_TOKEN: "${{ secrets.REPLICATE_API_KEY }}"
        run: python generate_maya_images.py

name: Run Maya Video Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-pipeline.yml'

env:
  REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install replicate requests python-dotenv Pillow boto3

      - name: Run pipeline
        run: |
          python pipeline.py \
            --image "https://pub-85573262a9e846c5896860df66eb8299.r2.dev/img/image_1778100540929_f5152823-4a6f-4c1e-8bfb-d2d03c20c8e2" \
            --name "Maya" \
            --style "cyber-elegance, luxury, neon, latex, glamour shot, cinematic lighting" \
            --motion 150

      - name: Upload video to R2
        env:
          R2_ENDPOINT_URL: https://a970eb068f3a6e1001defd42696cd440.r2.cloudflarestorage.com
          R2_ACCESS_KEY_ID: a970eb068f3a6e1001defd42696cd440
          R2_SECRET_ACCESS_KEY: afd7dba583ae4a2225f5c0feede764ada51d69dddad1dc8507d3e3c578dc4ef7
          R2_BUCKET: qte2wq7f5yx91i2k4uoye3u8pln544fp
          R2_KEY: test/maya_test1.mp4
        run: |
          python -c "
import boto3
import os

output_dir = 'output/'
video_files = []
for root, dirs, files in os.walk(output_dir):
    for f in files:
        if f.endswith(('.mp4', '.mov', '.avi', '.webm')):
            video_files.append(os.path.join(root, f))

if not video_files:
    print('No video files found in output/')
    exit(1)

video_file = video_files[0]
print(f'Uploading: {video_file}')

s3_client = boto3.client(
    's3',
    endpoint_url=os.environ['R2_ENDPOINT_URL'],
    aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],
    aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'],
)

bucket = os.environ['R2_BUCKET']
key = os.environ['R2_KEY']

with open(video_file, 'rb') as f:
    s3_client.upload_fileobj(f, bucket, key)

print(f'Uploaded successfully to {"https://pub-85573262a9e846c5896860df66eb8299.r2.dev"}/{key}')
"

      - name: Output URL
        run: |
          PUBLIC_URL="https://pub-85573262a9e846c5896860df66eb8299.r2.dev"
          KEY="test/maya_test1.mp4"
          echo "## Pipeline Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Public Video URL:" >> $GITHUB_STEP_SUMMARY
          echo "$PUBLIC_URL/$KEY" >> $GITHUB_STEP_SUMMARY

name: Run Maya Video Pipeline

on:
  workflow_dispatch:

env:
  REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install replicate requests python-dotenv Pillow boto3

      - name: Run pipeline
        run: |
          python pipeline.py \
            --image "https://pub-85573262a9e846c5896860df66eb8299.r2.dev/img/image_1778100540929_f5152823-4a6f-4c1e-8bfb-d2d03c20c8e2" \
            --name "Maya" \
            --style "cyber-elegance, luxury, neon, latex, glamour shot, cinematic lighting" \
            --motion 150

      - name: Upload video to R2
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_KEY: ${{ secrets.R2_KEY }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          python -c "
import boto3
import os

# Find the generated video file in output/ directory
output_dir = 'output/'
video_files = []
for root, dirs, files in os.walk(output_dir):
    for f in files:
        if f.endswith(('.mp4', '.mov', '.avi', '.webm')):
            video_files.append(os.path.join(root, f))

if not video_files:
    print('No video files found in output/ directory')
    exit(1)

# Use the first video file found
video_file = video_files[0]
print(f'Uploading: {video_file}')

# Configure S3 client for R2
s3_client = boto3.client(
    's3',
    endpoint_url=os.environ['R2_ENDPOINT_URL'],
    aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],
    aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'],
)

# Upload the file
bucket = os.environ['R2_BUCKET']
key = os.environ['R2_KEY']
public_url = os.environ['R2_PUBLIC_URL']

with open(video_file, 'rb') as f:
    s3_client.upload_fileobj(f, bucket, key)

print(f'Uploaded successfully to {public_url}')
print(f'video_url={public_url}')
" >> $GITHUB_STEP_SUMMARY

      - name: Output public URL
        run: |
          echo "## ✅ Pipeline Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Public Video URL:**" >> $GITHUB_STEP_SUMMARY
          echo "${{ secrets.R2_PUBLIC_URL }}" >> $GITHUB_STEP_SUMMARY
